# Paste at the TOP of the live site's .htaccess (before "# BEGIN WordPress").
# Live site only — not on staging. Sends http:// and the bare domain to https://www.sees-engineering.com.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{HTTPS} off [OR]
RewriteCond %{HTTP_HOST} !^www\.sees-engineering\.com$ [NC]
RewriteRule ^ https://www.sees-engineering.com%{REQUEST_URI} [L,R=301]
</IfModule>
